<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP Punts d'Interès</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="filters">
            <select id="typeFilter">
                <option value="">Tipus</option>
                <option value="Tots">Tots</option>
            </select>
            <select id="orderFilter">
                <option value="">Ordenació</option>
                <option value="asc">Ascendent</option>
                <option value="desc">Descendent</option>
            </select>
            <input type="text" id="nameFilter" placeholder="Filtrar per nom...">
            <button id="clearButton">Netejar llista</button>
        </div>
        
        <div class="drop-zone" id="dropZone">
            <p>Arrossegar fitxer CSV aquí</p>
        </div>
        
        <div class="info-panel">
            <h3>Llistat de punts d'interès</h3>
            <div id="pointsList">
                <p>No hi ha informació a mostrar</p>
            </div>
            <p id="totalElements">Total d'elements: 0</p>
        </div>
        
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="classes.js"></script>
    <script src="app.js"></script>
</body>
</html>
